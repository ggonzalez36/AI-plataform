global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'hybrid-rag-engine'
    static_configs:
      - targets: ['hybrid-rag-engine:8001']

  - job_name: 'mlops-inference'
    static_configs:
      - targets: ['mlops-inference:8002']
