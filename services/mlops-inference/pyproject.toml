[project]
name = "mlops-inference"
version = "0.1.0"
description = "High-throughput real-time inference service with ONNX Runtime and MLflow tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.17.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
