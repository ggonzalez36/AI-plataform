name: CI - Hybrid RAG Engine

on:
  push:
    branches: [main]
    paths:
      - 'services/hybrid-rag-engine/**'
      - '.github/workflows/ci-rag.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/hybrid-rag-engine/**'
      - '.github/workflows/ci-rag.yml'

jobs:
  test-rag:
    name: Test & Validate RAG Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        working-directory: services/hybrid-rag-engine
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx fastapi pydantic qdrant-client prometheus-client

      - name: Lint with Flake8
        working-directory: services/hybrid-rag-engine
        run: flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build Container Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: services/hybrid-rag-engine
          push: false
          tags: enterprise-hybrid-rag:latest
