name: CI - API Gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/ci-gateway.yml'

jobs:
  lint-and-test:
    name: Lint & Test API Gateway (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api-gateway/go.sum

      - name: Install dependencies
        working-directory: services/api-gateway
        run: go mod tidy && go mod download

      - name: Run Tests & Race Detector
        working-directory: services/api-gateway
        run: go test -v -race ./...

      - name: Build Container Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: false
          tags: enterprise-api-gateway:latest
